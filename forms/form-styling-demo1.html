<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formular-Styling Beispiel</title>
    <style>
        /* Grundlegende Seitenformatierung */
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        h2 {
            color: #333;
            text-align: center;
        }
        
        /* Formular-Styling */
        form {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        /* Label-Styling */
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        
        /* Textfeld-Styling */
        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        
        /* Dropdown-Styling */
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: white;
            box-sizing: border-box;
        }
        
        /* Button-Styling */
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        
        /* Zustandsbasiertes Styling */
        input:focus, 
        select:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 5px rgba(76,175,80,0.5);
        }
    </style>
</head>
<body>
    <h2>Kontaktformular</h2>
    
    <form action="#" method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Ihr vollständiger Name">
        
        <label for="email">E-Mail:</label>
        <input type="email" id="email" name="email" placeholder="Ihre E-Mail-Adresse">
        
        <label for="thema">Thema:</label>
        <select id="thema" name="thema">
            <option value="">Bitte wählen</option>
            <option value="frage">Frage</option>
            <option value="feedback">Feedback</option>
            <option value="problem">Problem melden</option>
            <option value="sonstiges">Sonstiges</option>
        </select>
        
        <input type="submit" value="Nachricht senden">
    </form>
</body>
</html>
